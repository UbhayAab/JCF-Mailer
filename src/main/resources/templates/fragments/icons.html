<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  The icon system.

  One <symbol> per icon, defined once per document, referenced with
  <svg class="ic"><use href="#i-name"/></svg>. Same-document <use> is the only
  form that works everywhere: an external sprite file needs a network fetch that
  Safari refuses cross-document and that our own Content-Security-Policy would
  have to widen for. Inlining costs about 9KB once and nothing thereafter.

  Every symbol is drawn on a 24x24 grid with no fill and stroke: currentColor.
  The stroke width, linecap and linejoin are set once on .ic in CSS rather than
  per symbol, so one rule retunes the whole set. Geometry is inset far enough
  that a 1.75 stroke never clips at the box edge.

  This replaces the text glyphs the mailbox used as icons: an envelope
  character, a pencil, a diamond and a padlock. Those are font characters, so
  they render as the operating system's emoji, which is why the padlock came
  out orange on Windows and would come out grey on a Mac and as a missing
  glyph box on a server with no emoji font. An icon has to be a shape we ship,
  not a character we hope the device happens to have.
-->
