spring.application.name=jarurat-mailer

# Public base URL used to build tracking and unsubscribe links
app.domain=${APP_DOMAIN:https://mailer.jarurat.care}

# Java 21 virtual threads
spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jarurat_mailer}
spring.datasource.username=${DB_USER:mailer_admin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=20

# H2 console is a remote code execution surface on a public box. Never enable it.
spring.h2.console.enabled=false

# CSV uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

server.port=8080
# nginx terminates TLS, so trust its forwarded headers when building absolute URLs
server.forward-headers-strategy=framework

# Session hardening
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=JCFSESSION

# AWS SES
aws.region=${AWS_REGION:ap-south-1}
aws.ses.domain=${SES_DOMAIN:jarurat.care}
aws.ses.fromEmail=${SES_FROM_EMAIL:admin@jarurat.care}
aws.ses.fromName=${SES_FROM_NAME:Jarurat Care Foundation}
aws.ses.replyTo=${SES_REPLY_TO:admin@jarurat.care}
# Account limit is 14/sec. Stay under it so we never eat a throttle.
# Without this, SES v2 publishes no per-message events and the message log can
# never learn what the recipient's server said. Identity level notifications are
# the v1 mechanism and do not cover SendEmail calls.
aws.ses.configurationSet=${SES_CONFIGURATION_SET:}
aws.ses.maxSendRate=${SES_MAX_SEND_RATE:12}
aws.ses.maxConcurrency=${SES_MAX_CONCURRENCY:16}

# Stalwart mail server, reached over loopback on this same box.
# The self-signed certificate carries exactly one SAN, DNS:localhost, and the
# client only relaxes trust for a loopback peer, so this must stay a local address.
jarurat.mail.jmap-url=${MAIL_JMAP_URL:https://127.0.0.1/jmap/}
jarurat.mail.domain=${MAIL_DOMAIN:jarurat.care}
jarurat.mail.connect-timeout-seconds=5
jarurat.mail.request-timeout-seconds=20
jarurat.mail.max-page-size=100
jarurat.mail.max-body-bytes=1000000

# Mailbox administration. Directory writes go over JMAP x:Account on the admin
# listener, which is a different port and a different credential from the webmail
# path above: webmail authenticates as the mailbox owner, this authenticates as
# the server administrator. Without a refresh token the Mailboxes screen renders
# a "not configured" notice rather than failing, so leaving this unset is safe.
# The token comes from the OAuth device-code flow and does not expire on its own.
jarurat.mail.admin.refresh-token=${STALWART_REFRESH_TOKEN:}
jarurat.mail.admin.jmap-url=${MAIL_ADMIN_JMAP_URL:https://127.0.0.1:8443/jmap/}
jarurat.mail.admin.token-url=${MAIL_ADMIN_TOKEN_URL:https://127.0.0.1:8443/auth/token}
jarurat.mail.admin.account-id=${MAIL_ADMIN_ACCOUNT_ID:d333333}
jarurat.mail.admin.domain-id=${MAIL_ADMIN_DOMAIN_ID:b}

# DNS resolvers for the Domains health checks. Empty means the OS resolvers, which
# is correct on the EC2 box. Override only when the local resolver truncates large
# TXT answers: nothing in a DNS reply marks it as abridged, so a truncating resolver
# reports a healthy domain as publishing no SPF record at all.
jarurat.mail.dns.servers=${MAIL_DNS_SERVERS:}

# Message log retention. The table is written once per recipient per send, so
# this is the knob that keeps it from growing without limit.
app.messagelog.retentionDays=${MESSAGELOG_RETENTION_DAYS:60}

# Where the receiving server's real SMTP reply comes from. Stalwart writes one
# date suffixed file per day and records the far end's verbatim answer for every
# delivery attempt; the app user needs read access to it (an ACL, not a group).
# Turn this off on any box that is not running Stalwart.
app.messagelog.stalwartLogDir=${STALWART_LOG_DIR:/var/log/stalwart}
app.messagelog.stalwartLogPrefix=${STALWART_LOG_PREFIX:stalwart}
app.messagelog.stalwartLogEnabled=${STALWART_LOG_ENABLED:true}

# Seed owner account, only used when the user table is empty
admin.email=${ADMIN_EMAIL:mailer@jarurat.care}
admin.password=${ADMIN_PASSWORD}

# Web Push. The key pair is a secret and belongs in the environment file beside
# OTP_PEPPER, never in the repository. Generate it once with
#   java -cp target/classes com.jarurat.mailer.push.VapidKeygen
# and never again: a new pair silently invalidates every push subscription the fleet
# already holds, so replacing it is a data migration and not a restart. Leaving these
# unset is supported and safe. The app boots, the mail client is unaffected, and
# GET /api/mail/push/config says push is off and why.
#
# THE SAME PRIVATE KEY ALSO GOES INTO STALWART'S jmap.webPushKey, and
# jmap.webPushContact must match PUSH_VAPID_SUBJECT. A browser hands its push service
# one application server key when it subscribes and the service refuses anything signed
# by a different one, so if this application and the mail server sign with different
# keys, whichever did not sign the subscription is answered 403 forever with no error
# on this side. The subject must be a real mailto: or https: URL: Apple rejects
# anything else, and it fails only on iPhones.
jarurat.push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY:}
jarurat.push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:}
jarurat.push.vapid.subject=${PUSH_VAPID_SUBJECT:mailto:postmaster@jarurat.care}

# How long a push service holds a message for a phone that is switched off. A day is
# right for mail: longer and somebody is told about something they read yesterday.
jarurat.push.ttl-seconds=${PUSH_TTL_SECONDS:86400}
jarurat.push.connect-timeout-seconds=5
jarurat.push.request-timeout-seconds=10

# When a subscription that has never returned 404 or 410 is treated as dead anyway.
# Some push services answer 400 forever for a browser profile that was deleted, and
# without this the table only ever grows.
jarurat.push.dead-after-failures=${PUSH_DEAD_AFTER_FAILURES:20}
jarurat.push.dead-after-days=${PUSH_DEAD_AFTER_DAYS:30}
