# name of application
spring.application.name=jarurat-mailer

# Turn on Java 21 Virtual Threads for massive scalability
spring.threads.virtual.enabled=true

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:mailerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically create our database tables based on our Java code
spring.jpa.hibernate.ddl-auto=update

# Enable a web console so we can visually look at our database later
spring.h2.console.enabled=true

# AWS SES Configuration
server.port=80
aws.region=ap-south-1
aws.ses.fromEmail=admin@horizonevent.info